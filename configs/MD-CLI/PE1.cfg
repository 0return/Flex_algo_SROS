# PE1 (1.1.1.1) - Lab_Flex_algo - MD-CLI (flat)
# SR-ISIS, MPLS, Flex-Algo, BGP and VPRN only (system, card and port config omitted)
# Usage: edit-config private -> paste -> compare -> commit

# --- Admin group and SR label block
/configure routing-options if-attribute admin-group "RED" value 1
/configure router "Base" mpls-labels sr-labels start 100000 end 100999

# --- Flexible Algorithm Definitions (advertised by the PEs)
/configure routing-options flexible-algorithm-definitions flex-algo "128-delay" admin-state enable
/configure routing-options flexible-algorithm-definitions flex-algo "128-delay" metric-type delay
/configure routing-options flexible-algorithm-definitions flex-algo "129-TE" admin-state enable
/configure routing-options flexible-algorithm-definitions flex-algo "129-TE" metric-type te-metric
/configure routing-options flexible-algorithm-definitions flex-algo "130-NO-RED" admin-state enable
/configure routing-options flexible-algorithm-definitions flex-algo "130-NO-RED" exclude admin-group "RED"

# --- Interfaces and link attributes
/configure router "Base" interface "system" ipv4 primary address 1.1.1.1 prefix-length 32
/configure router "Base" interface "toP1" port 1/1/c1/1
/configure router "Base" interface "toP1" ipv4 primary address 10.0.1.1 prefix-length 30
/configure router "Base" interface "toP1" if-attribute delay static 5000
/configure router "Base" interface "toP3" port 1/1/c2/1
/configure router "Base" interface "toP3" ipv4 primary address 10.0.3.1 prefix-length 30
/configure router "Base" interface "toP3" if-attribute delay static 3000
/configure router "Base" interface "toP6" port 1/1/c3/1
/configure router "Base" interface "toP6" ipv4 primary address 10.0.6.1 prefix-length 30
/configure router "Base" interface "toP6" if-attribute delay static 1000

# --- AS and TTL propagation for VPRN traceroute
/configure router "Base" autonomous-system 65000
/configure router "Base" ttl-propagate vprn-local all

# --- IS-IS (L2 only), SR and Flex-Algo participation
/configure router "Base" isis 0 admin-state enable
/configure router "Base" isis 0 level-capability 2
/configure router "Base" isis 0 area-address [49.0001]
/configure router "Base" isis 0 traffic-engineering true
/configure router "Base" isis 0 advertise-router-capability as
/configure router "Base" isis 0 segment-routing admin-state enable
/configure router "Base" isis 0 segment-routing prefix-sid-range global
/configure router "Base" isis 0 flexible-algorithms admin-state enable
/configure router "Base" isis 0 flexible-algorithms flex-algo 128 participate true
/configure router "Base" isis 0 flexible-algorithms flex-algo 128 advertise "128-delay"
/configure router "Base" isis 0 flexible-algorithms flex-algo 129 participate true
/configure router "Base" isis 0 flexible-algorithms flex-algo 129 advertise "129-TE"
/configure router "Base" isis 0 flexible-algorithms flex-algo 130 participate true
/configure router "Base" isis 0 flexible-algorithms flex-algo 130 advertise "130-NO-RED"
/configure router "Base" isis 0 interface "system" interface-type point-to-point
/configure router "Base" isis 0 interface "system" ipv4-node-sid index 1
/configure router "Base" isis 0 interface "system" flex-algo 128 ipv4-node-sid index 101
/configure router "Base" isis 0 interface "system" flex-algo 129 ipv4-node-sid index 201
/configure router "Base" isis 0 interface "system" flex-algo 130 ipv4-node-sid index 301
/configure router "Base" isis 0 interface "toP1" interface-type point-to-point
/configure router "Base" isis 0 interface "toP3" interface-type point-to-point
/configure router "Base" isis 0 interface "toP6" interface-type point-to-point

# --- MPLS (TE metric is taken from the MPLS interface)
/configure router "Base" mpls admin-state enable
/configure router "Base" mpls interface "system"
/configure router "Base" mpls interface "toP1" te-metric 100
/configure router "Base" mpls interface "toP3" te-metric 10
/configure router "Base" mpls interface "toP6" te-metric 50

# --- vrf-import policies: bind each VPRN to a Flex-Algo
/configure policy-options community "RT-1128" member "target:65000:1128"
/configure policy-options community "RT-1129" member "target:65000:1129"
/configure policy-options community "RT-1130" member "target:65000:1130"
/configure policy-options policy-statement "IMP-A128" entry 10 from community name "RT-1128"
/configure policy-options policy-statement "IMP-A128" entry 10 action action-type accept
/configure policy-options policy-statement "IMP-A128" entry 10 action flex-algo 128
/configure policy-options policy-statement "IMP-A129" entry 10 from community name "RT-1129"
/configure policy-options policy-statement "IMP-A129" entry 10 action action-type accept
/configure policy-options policy-statement "IMP-A129" entry 10 action flex-algo 129
/configure policy-options policy-statement "IMP-A130" entry 10 from community name "RT-1130"
/configure policy-options policy-statement "IMP-A130" entry 10 action action-type accept
/configure policy-options policy-statement "IMP-A130" entry 10 action flex-algo 130

# --- iBGP VPN-IPv4
/configure router "Base" bgp admin-state enable
/configure router "Base" bgp group "IBGP-VPN" peer-as 65000
/configure router "Base" bgp group "IBGP-VPN" local-address 1.1.1.1
/configure router "Base" bgp group "IBGP-VPN" family vpn-ipv4 true
/configure router "Base" bgp neighbor "2.2.2.2" group "IBGP-VPN"

# --- VPRN 1000 INTERNET-A0: algo 0 (no import policy)
/configure service vprn "INTERNET-A0" admin-state enable
/configure service vprn "INTERNET-A0" service-id 1000
/configure service vprn "INTERNET-A0" customer "1"
/configure service vprn "INTERNET-A0" interface "lo-test" loopback true
/configure service vprn "INTERNET-A0" interface "lo-test" ipv4 primary address 192.168.0.1 prefix-length 32
/configure service vprn "INTERNET-A0" bgp-ipvpn mpls admin-state enable
/configure service vprn "INTERNET-A0" bgp-ipvpn mpls route-distinguisher "1.1.1.1:1000"
/configure service vprn "INTERNET-A0" bgp-ipvpn mpls vrf-target community "target:65000:1000"
/configure service vprn "INTERNET-A0" bgp-ipvpn mpls auto-bind-tunnel resolution filter
/configure service vprn "INTERNET-A0" bgp-ipvpn mpls auto-bind-tunnel resolution-filter sr-isis true

# --- VPRN 1128 VOZ-A128: algo 128
/configure service vprn "VOZ-A128" admin-state enable
/configure service vprn "VOZ-A128" service-id 1128
/configure service vprn "VOZ-A128" customer "1"
/configure service vprn "VOZ-A128" interface "lo-test" loopback true
/configure service vprn "VOZ-A128" interface "lo-test" ipv4 primary address 192.168.128.1 prefix-length 32
/configure service vprn "VOZ-A128" bgp-ipvpn mpls admin-state enable
/configure service vprn "VOZ-A128" bgp-ipvpn mpls route-distinguisher "1.1.1.1:1128"
/configure service vprn "VOZ-A128" bgp-ipvpn mpls vrf-target community "target:65000:1128"
/configure service vprn "VOZ-A128" bgp-ipvpn mpls vrf-import policy ["IMP-A128"]
/configure service vprn "VOZ-A128" bgp-ipvpn mpls auto-bind-tunnel resolution filter
/configure service vprn "VOZ-A128" bgp-ipvpn mpls auto-bind-tunnel resolution-filter sr-isis true

# --- VPRN 1129 BULK-A129: algo 129
/configure service vprn "BULK-A129" admin-state enable
/configure service vprn "BULK-A129" service-id 1129
/configure service vprn "BULK-A129" customer "1"
/configure service vprn "BULK-A129" interface "lo-test" loopback true
/configure service vprn "BULK-A129" interface "lo-test" ipv4 primary address 192.168.129.1 prefix-length 32
/configure service vprn "BULK-A129" bgp-ipvpn mpls admin-state enable
/configure service vprn "BULK-A129" bgp-ipvpn mpls route-distinguisher "1.1.1.1:1129"
/configure service vprn "BULK-A129" bgp-ipvpn mpls vrf-target community "target:65000:1129"
/configure service vprn "BULK-A129" bgp-ipvpn mpls vrf-import policy ["IMP-A129"]
/configure service vprn "BULK-A129" bgp-ipvpn mpls auto-bind-tunnel resolution filter
/configure service vprn "BULK-A129" bgp-ipvpn mpls auto-bind-tunnel resolution-filter sr-isis true

# --- VPRN 1130 BANCO-A130: algo 130
/configure service vprn "BANCO-A130" admin-state enable
/configure service vprn "BANCO-A130" service-id 1130
/configure service vprn "BANCO-A130" customer "1"
/configure service vprn "BANCO-A130" interface "lo-test" loopback true
/configure service vprn "BANCO-A130" interface "lo-test" ipv4 primary address 192.168.130.1 prefix-length 32
/configure service vprn "BANCO-A130" bgp-ipvpn mpls admin-state enable
/configure service vprn "BANCO-A130" bgp-ipvpn mpls route-distinguisher "1.1.1.1:1130"
/configure service vprn "BANCO-A130" bgp-ipvpn mpls vrf-target community "target:65000:1130"
/configure service vprn "BANCO-A130" bgp-ipvpn mpls vrf-import policy ["IMP-A130"]
/configure service vprn "BANCO-A130" bgp-ipvpn mpls auto-bind-tunnel resolution filter
/configure service vprn "BANCO-A130" bgp-ipvpn mpls auto-bind-tunnel resolution-filter sr-isis true
