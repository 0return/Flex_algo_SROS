# P4 (100.0.0.4) - Lab_Flex_algo - MD-CLI (flat)
# SR-ISIS, MPLS, Flex-Algo only (system, card and port config omitted)
# Usage: edit-config private -> paste -> compare -> commit

# --- Admin group and SR label block
/configure routing-options if-attribute admin-group "RED" value 1
/configure router "Base" mpls-labels sr-labels start 100000 end 100999

# --- Interfaces and link attributes
/configure router "Base" interface "system" ipv4 primary address 100.0.0.4 prefix-length 32
/configure router "Base" interface "toP3" port 1/1/c1/1
/configure router "Base" interface "toP3" ipv4 primary address 172.16.2.2 prefix-length 30
/configure router "Base" interface "toP3" if-attribute delay static 3000
/configure router "Base" interface "toP5" port 1/1/c2/1
/configure router "Base" interface "toP5" ipv4 primary address 172.16.3.1 prefix-length 30
/configure router "Base" interface "toP5" if-attribute delay static 3000
/configure router "Base" interface "toP5" if-attribute admin-group ["RED"]
/configure router "Base" interface "toP7" port 1/1/c3/1
/configure router "Base" interface "toP7" ipv4 primary address 172.16.5.2 prefix-length 30
/configure router "Base" interface "toP7" if-attribute delay static 2000

# --- IS-IS (L2 only), SR and Flex-Algo participation
/configure router "Base" isis 0 admin-state enable
/configure router "Base" isis 0 level-capability 2
/configure router "Base" isis 0 area-address [49.0001]
/configure router "Base" isis 0 traffic-engineering true
/configure router "Base" isis 0 advertise-router-capability as
/configure router "Base" isis 0 segment-routing admin-state enable
/configure router "Base" isis 0 segment-routing prefix-sid-range global
/configure router "Base" isis 0 flexible-algorithms admin-state enable
/configure router "Base" isis 0 flexible-algorithms flex-algo 128 participate true
/configure router "Base" isis 0 flexible-algorithms flex-algo 129 participate true
/configure router "Base" isis 0 flexible-algorithms flex-algo 130 participate true
/configure router "Base" isis 0 interface "system" interface-type point-to-point
/configure router "Base" isis 0 interface "system" ipv4-node-sid index 5
/configure router "Base" isis 0 interface "system" flex-algo 128 ipv4-node-sid index 114
/configure router "Base" isis 0 interface "system" flex-algo 129 ipv4-node-sid index 214
/configure router "Base" isis 0 interface "system" flex-algo 130 ipv4-node-sid index 314
/configure router "Base" isis 0 interface "toP3" interface-type point-to-point
/configure router "Base" isis 0 interface "toP5" interface-type point-to-point
/configure router "Base" isis 0 interface "toP7" interface-type point-to-point

# --- MPLS (TE metric is taken from the MPLS interface)
/configure router "Base" mpls admin-state enable
/configure router "Base" mpls interface "system"
/configure router "Base" mpls interface "toP3" te-metric 10
/configure router "Base" mpls interface "toP5" te-metric 10
/configure router "Base" mpls interface "toP7" te-metric 10
