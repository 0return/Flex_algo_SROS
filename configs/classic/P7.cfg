# P7 (100.0.0.7) - Lab_Flex_algo - classic CLI
# SR-ISIS, MPLS, Flex-Algo only (system, card and port config omitted)
exit all
configure
    router Base
        mpls-labels
            sr-labels start 100000 end 100999
        exit
        if-attribute
            admin-group "RED" value 1
        exit
        interface "system"
            address 100.0.0.7/32
            no shutdown
        exit
        interface "toP6"
            address 172.16.4.2/30
            port 1/1/c1/1
            if-attribute
                delay
                    static 2000
                exit
            exit
            no shutdown
        exit
        interface "toPE2"
            address 10.0.7.2/30
            port 1/1/c2/1
            if-attribute
                delay
                    static 1000
                exit
            exit
            no shutdown
        exit
        interface "toP4"
            address 172.16.5.1/30
            port 1/1/c3/1
            if-attribute
                delay
                    static 2000
                exit
            exit
            no shutdown
        exit
        isis 0
            level-capability level-2
            area-id 49.0001
            traffic-engineering
            advertise-router-capability as
            flexible-algorithms
                flex-algo 128
                    participate
                exit
                flex-algo 129
                    participate
                exit
                flex-algo 130
                    participate
                exit
                no shutdown
            exit
            segment-routing
                prefix-sid-range global
                no shutdown
            exit
            interface "system"
                interface-type point-to-point
                ipv4-node-sid index 9
                flex-algo 128
                    ipv4-node-sid index 117
                exit
                flex-algo 129
                    ipv4-node-sid index 217
                exit
                flex-algo 130
                    ipv4-node-sid index 317
                exit
                no shutdown
            exit
            interface "toP6"
                interface-type point-to-point
                level 2
                    metric 50
                exit
                no shutdown
            exit
            interface "toPE2"
                interface-type point-to-point
                level 2
                    metric 20
                exit
                no shutdown
            exit
            interface "toP4"
                interface-type point-to-point
                no shutdown
            exit
            no shutdown
        exit
        mpls
            interface "system"
                no shutdown
            exit
            interface "toP6"
                te-metric 50
                no shutdown
            exit
            interface "toPE2"
                te-metric 50
                no shutdown
            exit
            interface "toP4"
                te-metric 10
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all
