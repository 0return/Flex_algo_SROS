# P4 (100.0.0.4) - Lab_Flex_algo - classic CLI
# SR-ISIS, MPLS, Flex-Algo only (system, card and port config omitted)
exit all
configure
    router Base
        mpls-labels
            sr-labels start 100000 end 100999
        exit
        if-attribute
            admin-group "RED" value 1
        exit
        interface "system"
            address 100.0.0.4/32
            no shutdown
        exit
        interface "toP3"
            address 172.16.2.2/30
            port 1/1/c1/1
            if-attribute
                delay
                    static 3000
                exit
            exit
            no shutdown
        exit
        interface "toP5"
            address 172.16.3.1/30
            port 1/1/c2/1
            if-attribute
                admin-group "RED"
                delay
                    static 3000
                exit
            exit
            no shutdown
        exit
        interface "toP7"
            address 172.16.5.2/30
            port 1/1/c3/1
            if-attribute
                delay
                    static 2000
                exit
            exit
            no shutdown
        exit
        isis 0
            level-capability level-2
            area-id 49.0001
            traffic-engineering
            advertise-router-capability as
            flexible-algorithms
                flex-algo 128
                    participate
                exit
                flex-algo 129
                    participate
                exit
                flex-algo 130
                    participate
                exit
                no shutdown
            exit
            segment-routing
                prefix-sid-range global
                no shutdown
            exit
            interface "system"
                interface-type point-to-point
                ipv4-node-sid index 5
                flex-algo 128
                    ipv4-node-sid index 114
                exit
                flex-algo 129
                    ipv4-node-sid index 214
                exit
                flex-algo 130
                    ipv4-node-sid index 314
                exit
                no shutdown
            exit
            interface "toP3"
                interface-type point-to-point
                no shutdown
            exit
            interface "toP5"
                interface-type point-to-point
                no shutdown
            exit
            interface "toP7"
                interface-type point-to-point
                no shutdown
            exit
            no shutdown
        exit
        mpls
            interface "system"
                no shutdown
            exit
            interface "toP3"
                te-metric 10
                no shutdown
            exit
            interface "toP5"
                te-metric 10
                no shutdown
            exit
            interface "toP7"
                te-metric 10
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all
