# P2 (100.0.0.2) - Lab_Flex_algo - classic CLI
# SR-ISIS, MPLS, Flex-Algo only (system, card and port config omitted)
exit all
configure
    router Base
        mpls-labels
            sr-labels start 100000 end 100999
        exit
        if-attribute
            admin-group "RED" value 1
        exit
        interface "system"
            address 100.0.0.2/32
            no shutdown
        exit
        interface "toP1"
            address 172.16.1.2/30
            port 1/1/c1/1
            if-attribute
                admin-group "RED"
                delay
                    static 5000
                exit
            exit
            no shutdown
        exit
        interface "toPE2"
            address 10.0.2.2/30
            port 1/1/c2/1
            if-attribute
                delay
                    static 5000
                exit
            exit
            no shutdown
        exit
        isis 0
            level-capability level-2
            area-id 49.0001
            traffic-engineering
            advertise-router-capability as
            flexible-algorithms
                flex-algo 128
                    participate
                exit
                flex-algo 129
                    participate
                exit
                flex-algo 130
                    participate
                exit
                no shutdown
            exit
            segment-routing
                prefix-sid-range global
                no shutdown
            exit
            interface "system"
                interface-type point-to-point
                ipv4-node-sid index 3
                flex-algo 128
                    ipv4-node-sid index 112
                exit
                flex-algo 129
                    ipv4-node-sid index 212
                exit
                flex-algo 130
                    ipv4-node-sid index 312
                exit
                no shutdown
            exit
            interface "toP1"
                interface-type point-to-point
                no shutdown
            exit
            interface "toPE2"
                interface-type point-to-point
                no shutdown
            exit
            no shutdown
        exit
        mpls
            interface "system"
                no shutdown
            exit
            interface "toP1"
                te-metric 100
                no shutdown
            exit
            interface "toPE2"
                te-metric 100
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all
