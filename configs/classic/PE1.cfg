# PE1 (1.1.1.1) - Lab_Flex_algo - classic CLI
# SR-ISIS, MPLS, Flex-Algo, BGP and VPRN only (system, card and port config omitted)
exit all
configure
    router Base
        mpls-labels
            sr-labels start 100000 end 100999
        exit
        if-attribute
            admin-group "RED" value 1
        exit
        flexible-algorithm-definitions
            flex-algo "128-delay" create
                metric-type delay
                no shutdown
            exit
            flex-algo "129-TE" create
                metric-type te-metric
                no shutdown
            exit
            flex-algo "130-NO-RED" create
                exclude
                    admin-group "RED"
                exit
                no shutdown
            exit
        exit
        interface "system"
            address 1.1.1.1/32
            no shutdown
        exit
        interface "toP1"
            address 10.0.1.1/30
            port 1/1/c1/1
            if-attribute
                delay
                    static 5000
                exit
            exit
            no shutdown
        exit
        interface "toP3"
            address 10.0.3.1/30
            port 1/1/c2/1
            if-attribute
                delay
                    static 3000
                exit
            exit
            no shutdown
        exit
        interface "toP6"
            address 10.0.6.1/30
            port 1/1/c3/1
            if-attribute
                delay
                    static 1000
                exit
            exit
            no shutdown
        exit
        autonomous-system 65000
        ttl-propagate
            vprn-local all
        exit
        isis 0
            level-capability level-2
            area-id 49.0001
            traffic-engineering
            advertise-router-capability as
            flexible-algorithms
                flex-algo 128
                    advertise "128-delay"
                    participate
                exit
                flex-algo 129
                    advertise "129-TE"
                    participate
                exit
                flex-algo 130
                    advertise "130-NO-RED"
                    participate
                exit
                no shutdown
            exit
            segment-routing
                prefix-sid-range global
                no shutdown
            exit
            interface "system"
                interface-type point-to-point
                ipv4-node-sid index 1
                flex-algo 128
                    ipv4-node-sid index 101
                exit
                flex-algo 129
                    ipv4-node-sid index 201
                exit
                flex-algo 130
                    ipv4-node-sid index 301
                exit
                no shutdown
            exit
            interface "toP1"
                interface-type point-to-point
                no shutdown
            exit
            interface "toP3"
                interface-type point-to-point
                no shutdown
            exit
            interface "toP6"
                interface-type point-to-point
                no shutdown
            exit
            no shutdown
        exit
        mpls
            interface "system"
                no shutdown
            exit
            interface "toP1"
                te-metric 100
                no shutdown
            exit
            interface "toP3"
                te-metric 10
                no shutdown
            exit
            interface "toP6"
                te-metric 50
                no shutdown
            exit
            no shutdown
        exit
        policy-options
            begin
            community "RT-1128"
                members "target:65000:1128"
            exit
            community "RT-1129"
                members "target:65000:1129"
            exit
            community "RT-1130"
                members "target:65000:1130"
            exit
            policy-statement "IMP-A128"
                entry 10
                    from
                        community "RT-1128"
                    exit
                    action accept
                        flex-algo 128
                    exit
                exit
            exit
            policy-statement "IMP-A129"
                entry 10
                    from
                        community "RT-1129"
                    exit
                    action accept
                        flex-algo 129
                    exit
                exit
            exit
            policy-statement "IMP-A130"
                entry 10
                    from
                        community "RT-1130"
                    exit
                    action accept
                        flex-algo 130
                    exit
                exit
            exit
            commit
        exit
        bgp
            group "IBGP-VPN"
                family vpn-ipv4
                peer-as 65000
                local-address 1.1.1.1
                neighbor 2.2.2.2
                exit
            exit
            no shutdown
        exit
    exit
    service
        vprn 1000 name "INTERNET-A0" customer 1 create
            interface "lo-test" create
                address 192.168.0.1/32
                loopback
            exit
            bgp-ipvpn
                mpls
                    auto-bind-tunnel
                        resolution-filter
                            sr-isis
                        exit
                        resolution filter
                    exit
                    route-distinguisher 1.1.1.1:1000
                    vrf-target target:65000:1000
                    no shutdown
                exit
            exit
            no shutdown
        exit
        vprn 1128 name "VOZ-A128" customer 1 create
            interface "lo-test" create
                address 192.168.128.1/32
                loopback
            exit
            bgp-ipvpn
                mpls
                    auto-bind-tunnel
                        resolution-filter
                            sr-isis
                        exit
                        resolution filter
                    exit
                    route-distinguisher 1.1.1.1:1128
                    vrf-import "IMP-A128"
                    vrf-target target:65000:1128
                    no shutdown
                exit
            exit
            no shutdown
        exit
        vprn 1129 name "BULK-A129" customer 1 create
            interface "lo-test" create
                address 192.168.129.1/32
                loopback
            exit
            bgp-ipvpn
                mpls
                    auto-bind-tunnel
                        resolution-filter
                            sr-isis
                        exit
                        resolution filter
                    exit
                    route-distinguisher 1.1.1.1:1129
                    vrf-import "IMP-A129"
                    vrf-target target:65000:1129
                    no shutdown
                exit
            exit
            no shutdown
        exit
        vprn 1130 name "BANCO-A130" customer 1 create
            interface "lo-test" create
                address 192.168.130.1/32
                loopback
            exit
            bgp-ipvpn
                mpls
                    auto-bind-tunnel
                        resolution-filter
                            sr-isis
                        exit
                        resolution filter
                    exit
                    route-distinguisher 1.1.1.1:1130
                    vrf-import "IMP-A130"
                    vrf-target target:65000:1130
                    no shutdown
                exit
            exit
            no shutdown
        exit
    exit
exit all
